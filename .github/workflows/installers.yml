# Windows 用セットアップウィザード（.exe）と macOS 用インストーラー（.pkg）を作る。
# - 手動実行（Actions タブの「Run workflow」）・main への push・プルリクエストでビルドし、成果物（Artifacts）に置く
# - v から始まるタグ（例: v0.1.0）を push すると、GitHub の Releases にも添付する
name: Installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (.exe installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test, build and package
        shell: pwsh
        run: ./windows/build.ps1

      - name: Zip portable build
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path build/windows/publish/* -DestinationPath "build/windows/Suzu-$v-win-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Suzu-windows
          path: |
            build/windows/SuzuSetup-*.exe
            build/windows/Suzu-*-portable.zip
          if-no-files-found: error

  macos:
    name: macOS (.pkg installer)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build installer
        run: scripts/build_pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Suzu-macos
          path: build/Suzu-*.pkg
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
