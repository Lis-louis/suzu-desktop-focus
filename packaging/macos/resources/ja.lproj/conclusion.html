<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; line-height: 1.6; color: #222; }
  h1 { font-size: 18px; color: #3D4A8F; margin: 0 0 8px; }
  .note { color: #666; font-size: 12px; }
  @media (prefers-color-scheme: dark) { body { color: #eee; } h1 { color: #A9B8EE; } .note { color: #aaa; } }
</style>
</head>
<body>
<h1>インストールが完了しました</h1>
<p>鈴がデスクトップに現れます。現れないときは、Launchpad または「アプリケーション」フォルダの <b>Suzu</b> を開いてください。</p>
<p>コントロールパネルの「ログイン時に起動」をオンにすると、Mac にログインしたときに自動で起動します。</p>
<p class="note">アンインストールするには、アプリを終了してから「アプリケーション」フォルダの Suzu をゴミ箱に入れてください。</p>
</body>
</html>
